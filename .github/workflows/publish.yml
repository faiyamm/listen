name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      # node 22 bundles npm 10, and trusted publishing needs npm 11.5.1 or newer
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - name: Check that the release tag matches the package version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "release tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: npm publish
